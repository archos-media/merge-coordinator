name: Bug
description: Something the plugin did wrong, or refused when it should not have.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: "`version` in the installed plugin's `.claude-plugin/plugin.json`, or the tag of your pinned copy."
      placeholder: e.g. 0.5.0
    validations:
      required: true
  - type: dropdown
    id: backbone
    attributes:
      label: Backbone
      description: "`backbone` in your `.github/merge-coordinator.json`."
      options:
        - github-merge-queue
        - serialized-claim
        - not adopted (no config)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, `claude --version` and `gh --version`.
      placeholder: e.g. Ubuntu 24.04, Claude Code 2.1.303, gh 2.80.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, and its full output. For a refusal, paste the refusal text.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest set of steps, config and pull request state that shows it.
    validations:
      required: true
